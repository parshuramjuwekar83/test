apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sahamati-token-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: sahamati.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sahamati-token-service
                port:
                  number: 80
