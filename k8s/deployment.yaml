apiVersion: apps/v1
kind: Deployment
metadata:
  name: sahamati-token-service
  labels:
    app: sahamati-token-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sahamati-token-service
  template:
    metadata:
      labels:
        app: sahamati-token-service
    spec:
      containers:
        - name: sahamati-token-service
          image: your-registry/sahamati-token-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: sahamati-config
                  key: db.url
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: sahamati-secret
                  key: db.user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sahamati-secret
                  key: db.password
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
