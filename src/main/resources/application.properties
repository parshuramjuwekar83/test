# Server
quarkus.http.port=${HTTP_PORT:8080}

# Datasource (Postgres)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/sahamati_db}
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# Health endpoints
quarkus.smallrye-health.root-path=/q/health

# Logging
quarkus.log.level=INFO

# External API defaults (can be overridden by Config table)
sahamati.external.entity-token-url=https://central-registry.saafe.in/entity-auth/token
sahamati.external.user-token-url=https://central-registry.saafe.in/iam-user/token
sahamati.external.entity-secret-read-url=https://central-registry.saafe.in/iam-user/entity-secret-read
sahamati.external.entity-secret-reset-url=https://central-registry.saafe.in/iam-user/entity-secret-reset
